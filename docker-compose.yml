services:
  postgres:
    image: postgres:16-alpine
    container_name: dental-recovery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dental_recovery
      POSTGRES_USER: dental
      POSTGRES_PASSWORD: dental
    ports:
      - "5432:5432"
    volumes:
      - dental_recovery_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dental -d dental_recovery"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: dental-recovery-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dental_recovery_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dental_recovery_postgres:
  dental_recovery_redis:
