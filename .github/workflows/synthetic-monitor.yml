name: Synthetic Launch Monitor

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Controlled staging or preview base URL"
        required: false
        type: string
      allow_production:
        description: "Allow monitor against production hostnames after tenant and cleanup approval"
        required: false
        type: boolean
        default: false
      monitor_mode:
        description: "Use preview smoke for public Vercel previews, or full for controlled staging"
        required: false
        type: choice
        default: preview
        options:
          - preview
          - full
  schedule:
    - cron: "*/30 * * * *"

jobs:
  monitor:
    name: Public routes, trial, inbox, billing, and health secrecy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BASE_URL: ${{ inputs.base_url || secrets.SYNTHETIC_MONITOR_BASE_URL }}
      SYNTHETIC_MONITOR_ALLOW_PRODUCTION: ${{ inputs.allow_production && 'true' || 'false' }}
      SYNTHETIC_MONITOR_MODE: ${{ inputs.monitor_mode || vars.SYNTHETIC_MONITOR_MODE || 'preview' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run public preview monitor
        if: ${{ env.SYNTHETIC_MONITOR_MODE == 'preview' }}
        run: npm run monitor:preview

      - name: Run full synthetic launch monitor
        if: ${{ env.SYNTHETIC_MONITOR_MODE != 'preview' }}
        run: npm run monitor:synthetic:guarded
