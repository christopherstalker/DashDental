name: Go-live rescue validation

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_production_gate:
        description: "Run production go-live gate. Requires launch env/secrets."
        required: false
        default: "false"

jobs:
  validate:
    name: Build, test, and launch-safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Regression tests
        run: npm run test:regression

      - name: Production build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E launch smoke
        env:
          NEXT_DIST_DIR: .next-codex-ci-e2e
          PLAYWRIGHT_PORT: 3101
        run: npm run test:e2e

      - name: Production go-live gate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_production_gate == 'true' }}
        env:
          APP_URL: ${{ secrets.APP_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          INTEGRATION_SECRET: ${{ secrets.INTEGRATION_SECRET }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          SUPPORT_OWNER_NAME: ${{ vars.SUPPORT_OWNER_NAME }}
          SUPPORT_OWNER_EMAIL: support@dashdental.space
          SECURITY_CONTACT_EMAIL: security@dashdental.space
          INCIDENT_ESCALATION_EMAIL: security@dashdental.space
          EDGE_RATE_LIMIT_PROFILE: launch
          EDGE_PROTECTION_DEPLOYED: ${{ vars.EDGE_PROTECTION_DEPLOYED }}
          DATABASE_BACKUPS_CONFIRMED: ${{ vars.DATABASE_BACKUPS_CONFIRMED }}
          REQUIRE_PUBLIC_AUTH_BOT_PROTECTION: "true"
          SYNTHETIC_MONITOR_BASE_URL: ${{ vars.SYNTHETIC_MONITOR_BASE_URL }}
          SYNTHETIC_MONITOR_SCHEDULED: ${{ vars.SYNTHETIC_MONITOR_SCHEDULED }}
          PRODUCTION_MONITOR_POLICY_APPROVED: ${{ vars.PRODUCTION_MONITOR_POLICY_APPROVED }}
          LEGAL_REVIEW_APPROVED: ${{ vars.LEGAL_REVIEW_APPROVED }}
          DPA_APPROVED: ${{ vars.DPA_APPROVED }}
          SUBPROCESSORS_APPROVED: ${{ vars.SUBPROCESSORS_APPROVED }}
          ORDER_FORM_APPROVED: ${{ vars.ORDER_FORM_APPROVED }}
          CANCELLATION_POLICY_APPROVED: ${{ vars.CANCELLATION_POLICY_APPROVED }}
          DATA_HANDLING_POLICY_APPROVED: ${{ vars.DATA_HANDLING_POLICY_APPROVED }}
          FIRST_CLINIC_REHEARSAL_APPROVED: ${{ vars.FIRST_CLINIC_REHEARSAL_APPROVED }}
          BILLING_PROVIDER: manual
          MANUAL_BILLING_SUPPORT_EMAIL: support@dashdental.space
          MANUAL_BILLING_RECIPIENT_NAME: ${{ vars.MANUAL_BILLING_RECIPIENT_NAME }}
          MANUAL_BILLING_INSTRUCTIONS: ${{ vars.MANUAL_BILLING_INSTRUCTIONS }}
          MANUAL_INVOICE_TEMPLATE_APPROVED: ${{ vars.MANUAL_INVOICE_TEMPLATE_APPROVED }}
        run: npm run go-live:check
