name: Go-live rescue validation

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_production_gate:
        description: "Verify the reviewed Vercel production build gate contract."
        required: false
        default: "false"

jobs:
  validate:
    name: Build, test, and launch-safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Regression tests
        run: npm run test:regression

      - name: Production build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E launch smoke
        env:
          NEXT_DIST_DIR: .next-codex-ci-e2e
          PLAYWRIGHT_PORT: 3101
        run: npm run test:e2e

  production-gate:
    name: Production deployment gate contract
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_production_gate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify Vercel production build gate is wired
        run: |
          node -e "const pkg=require('./package.json'); if (pkg.scripts['vercel:build'] !== 'tsx scripts/vercel-build.ts') process.exit(1)"
          node -e "const config=require('./vercel.json'); if (config.buildCommand !== 'npm run vercel:build') process.exit(1)"
          node -e "const fs=require('fs'); const script=fs.readFileSync('scripts/vercel-build.ts','utf8'); if (!script.includes('VERCEL_ENV === \"production\"') || !script.includes('\"go-live:check\"')) process.exit(1)"
